<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDeck Shortcuts</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1e2128;
    --panel2: #262a33;
    --ink: #e8eaf0;
    --muted: #8a90a0;
    --accent: #4c9aff;
    --warn: #e0a03c;
    --danger: #e05c5c;
    --ok: #4caf7d;
    --border: #333845;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px; background: var(--panel); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .field { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  input, select, button {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font: inherit;
  }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  #identity { width: 240px; }
  button { cursor: pointer; }
  #apply { background: var(--accent); border-color: var(--accent); color: #08111f; font-weight: 600; }
  #result { font-size: 13px; }
  #result.ok { color: var(--ok); }
  #identitywarning {
    display: none; width: 100%; margin-top: 6px; padding: 5px 9px; border-radius: 4px;
    font-size: 12px; color: var(--warn); border: 1px solid var(--warn); background: #2a1f0d;
  }
  #identitywarning.show { display: block; }
  #guess {
    display: none; margin: 10px auto; padding: 7px 12px; border: 1px solid var(--warn);
    background: transparent; color: var(--warn); border-radius: 4px; cursor: pointer;
  }
  #guess.show { display: block; }
  #guess:disabled { opacity: .6; cursor: default; }
  .thumb.blank {
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px dashed var(--border); border-radius: 4px; color: var(--muted);
    font-size: 16px; cursor: pointer;
  }
  .thumb { cursor: pointer; }
  #iconpicker {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: center; justify-content: center; z-index: 10;
  }
  #iconpicker.show { display: flex; }
  #iconpicker .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; width: min(560px, 92vw); max-height: 86vh; overflow: auto;
  }
  #iconpicker h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  #iconpicker .hint { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
  #tray { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
  #tray figure { margin: 0; text-align: center; }
  #tray img {
    width: 72px; height: 72px; border-radius: 6px; border: 2px solid transparent;
    background: #000; cursor: pointer; display: block;
  }
  #tray img:hover { border-color: var(--accent); }
  #tray .is-chosen img { border-color: var(--ok); }
  #tray figcaption { font-size: 11px; color: var(--muted); margin-top: 3px; }
  #iconpicker .actions { display: flex; gap: 8px; }
  #result.err { color: var(--danger); }

  main { display: flex; gap: 18px; padding: 18px; align-items: flex-start; }

  /* left pane */
  #left { flex: 1 1 60%; min-width: 0; }
  .filters { display: flex; gap: 10px; margin-bottom: 12px; }
  #textfilter { flex: 1; }
  #list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .shortcut {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; user-select: none;
  }
  .shortcut:hover { border-color: var(--accent); }
  .shortcut.dragging { opacity: 0.4; }
  .combo {
    font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", monospace;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 7px; font-size: 12px; white-space: nowrap; color: var(--accent);
  }
  .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .badge { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 10px; font-weight: 600; }
  .badge.extracted { background: #1e3a2a; color: var(--ok); }
  .badge.curated { background: #1e3550; color: var(--accent); }
  .badge.guessed { background: #4a3417; color: var(--warn); border: 1px solid var(--warn); }
  .collision {
    background: #4a1e1e; color: var(--danger); border: 1px solid var(--danger);
    font-size: 10px; padding: 2px 7px; border-radius: 10px; white-space: nowrap;
  }
  .thumb { width: 20px; height: 20px; object-fit: contain; }

  /* right pane */
  #right { flex: 0 0 auto; }
  .counter { text-align: right; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  #deck {
    display: grid; grid-template-columns: repeat(3, 92px); gap: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px;
  }
  .cell {
    height: 74px; border-radius: 9px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    border: 1px dashed var(--border); position: relative;
  }
  .cell.reserved {
    background: #191c22; border-style: solid; color: var(--muted);
    font-size: 11px; cursor: default; opacity: 0.8;
  }
  .cell.slot { background: var(--panel2); cursor: pointer; }
  .cell.slot.empty { color: var(--muted); font-size: 12px; border-style: dashed; }
  .cell.slot.over { outline: 2px solid var(--accent); outline-offset: -2px; }
  .slot-label { font-size: 11px; text-align: center; overflow: hidden; text-overflow: ellipsis; width: 100%; padding: 0 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .slot-icon { width: 22px; height: 22px; object-fit: contain; }
  .empty-hint { color: var(--muted); font-size: 12px; margin-top: 10px; max-width: 300px; }
</style>
</head>
<body>
<header>
  <h1>OpenDeck Shortcuts</h1>
  <label class="field">identity <input id="identity" list="published" spellcheck="false" placeholder="e.g. kitty:claude"></label>
  <datalist id="published"></datalist>
  <label class="field">device <select id="device"></select></label>
  <button id="apply">Apply</button>
  <span id="result"></span>
  <div id="identitywarning"></div>
</header>

<div id="iconpicker">
  <div class="panel">
    <h2 id="ip-title"></h2>
    <p class="hint">Click a candidate to put it on the key. Drawing another costs one generation.</p>
    <div id="tray"></div>
    <div class="actions">
      <button id="ip-draw">Draw another</button>
      <button id="ip-close">Close</button>
    </div>
  </div>
</div>

<main>
  <section id="left">
    <button id="guess"></button>
    <div class="filters">
      <input id="textfilter" placeholder="Filter by label or combo...">
      <select id="catfilter"><option value="">All categories</option></select>
    </div>
    <ul id="list"></ul>
  </section>

  <section id="right">
    <div class="counter" id="counter">0 of 15 used</div>
    <div id="deck"></div>
    <div class="empty-hint">Click a shortcut to fill the first free slot, drag onto a slot to place it there, click a slot to clear it. Nothing is written until Apply.</div>
  </section>
</main>

<script>
  const RESERVED_LABELS = {0: "Launcher", 1: "Auto", 2: "Dial"};
  const FIRST_KEY = 3, LAST_KEY = 17;

  const state = {
    identity: "",
    device: "",
    shortcuts: [],
    assignments: {},   // position (int) -> shortcut id
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    // An icon is either a data: URI we can use directly or a filesystem path the app ships,
    // which only the guarded /api/icon route will hand over.
    function iconSrc(icon) {
      return icon.startsWith("data:") ? icon : "/api/icon?path=" + encodeURIComponent(icon);
    }

    // App art if the application ships some, otherwise whatever the resolver already had for
    // this action -- a generated glyph from this machine's cache or from the shared store.
    function artOf(sc) {
      return sc.icon || sc.thumbnail || null;
    }


  function shortcutById(id) {
    return state.shortcuts.find((s) => s.id === id);
  }
  function usedCount() {
    return Object.keys(state.assignments).length;
  }
  function firstFreeSlot() {
    for (let p = FIRST_KEY; p <= LAST_KEY; p++) if (!state.assignments[p]) return p;
    return -1;
  }

  // -- deck -----------------------------------------------------------------
  function renderDeck() {
    const deck = $("deck");
    deck.innerHTML = "";
    for (let p = 0; p <= LAST_KEY; p++) {
      const cell = document.createElement("div");
      if (p < FIRST_KEY) {
        cell.className = "cell reserved";
        cell.textContent = RESERVED_LABELS[p];
        cell.title = "reserved";
      } else {
        cell.className = "cell slot";
        cell.dataset.pos = p;
        const id = state.assignments[p];
        const sc = id ? shortcutById(id) : null;
        if (sc) {
          const label = document.createElement("span");
          label.className = "slot-label";
          label.textContent = sc.label;
          cell.appendChild(label);
          const art = artOf(sc);
          if (art) {
            const img = document.createElement("img");
            img.className = "slot-icon";
            img.src = iconSrc(art);
            img.onerror = () => img.remove();
            cell.appendChild(img);
          }
        } else {
          cell.classList.add("empty");
          cell.textContent = "empty";
        }
        cell.addEventListener("click", () => {
          delete state.assignments[p];
          renderDeck();
        });
        cell.addEventListener("dragover", (e) => { e.preventDefault(); cell.classList.add("over"); });
        cell.addEventListener("dragleave", () => cell.classList.remove("over"));
        cell.addEventListener("drop", (e) => {
          e.preventDefault();
          cell.classList.remove("over");
          const sc = shortcutById(e.dataTransfer.getData("text/plain"));
          if (sc) { state.assignments[p] = sc.id; renderDeck(); }
        });
      }
      deck.appendChild(cell);
    }
    $("counter").textContent = usedCount() + " of 15 used";
  }

  // -- shortcut list --------------------------------------------------------
  function renderList() {
    const text = $("textfilter").value.trim().toLowerCase();
    const cat = $("catfilter").value;
    const list = $("list");
    list.innerHTML = "";
    const filtered = state.shortcuts.filter((s) => {
      if (cat && s.category !== cat) return false;
      if (text && !(s.label + " " + s.combo).toLowerCase().includes(text)) return false;
      return true;
    });
    for (const sc of filtered) {
      const li = document.createElement("li");
      li.className = "shortcut";
      li.draggable = true;

      const art = artOf(sc);
      if (art) {
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = iconSrc(art);
        img.title = `icon: ${sc.icon ? "shipped by the app" : sc.icon_origin} \u2014 click to change`;
        img.onerror = () => img.remove();
        img.addEventListener("click", (e) => { e.stopPropagation(); openTray(sc); });
        li.appendChild(img);
      } else {
        // No art anywhere: the placeholder is how an action gets its first one.
        const blank = document.createElement("div");
        blank.className = "thumb blank";
        blank.textContent = "+";
        blank.title = "no icon yet - click to draw one";
        blank.addEventListener("click", (e) => { e.stopPropagation(); openTray(sc); });
        li.appendChild(blank);
      }

      const combo = document.createElement("span");
      combo.className = "combo";
      combo.textContent = sc.combo;
      li.appendChild(combo);

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = sc.label;
      li.appendChild(label);

      const badge = document.createElement("span");
      badge.className = "badge " + sc.provenance;
      badge.textContent = sc.provenance;
      li.appendChild(badge);

      if (sc.category) {
        const catSpan = document.createElement("span");
        catSpan.className = "cat";
        catSpan.textContent = sc.category;
        li.appendChild(catSpan);
      }

      if (sc.collision) {
        const mark = document.createElement("span");
        mark.className = "collision";
        mark.textContent = "collision";
        mark.title = "same combo appears more than once";
        li.appendChild(mark);
      }

      li.addEventListener("click", () => assignFirstFree(sc));
      li.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", sc.id);
        e.dataTransfer.effectAllowed = "move";
        li.classList.add("dragging");
      });
      li.addEventListener("dragend", () => li.classList.remove("dragging"));

      list.appendChild(li);
    }
  }

  function assignFirstFree(sc) {
    const p = firstFreeSlot();
    if (p < 0) return;
    state.assignments[p] = sc.id;
    renderDeck();
  }

  function rebuildCategoryFilter() {
    const cats = [...new Set(state.shortcuts.map((s) => s.category).filter(Boolean))].sort();
    $("catfilter").innerHTML = '<option value="">All categories</option>' +
      cats.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  }

  // -- data -----------------------------------------------------------------
  async function fetchJSON(url, options) {
    const r = await fetch(url, options);
    return r.json();
  }

  async function loadIdentity() {
    const data = await fetchJSON("/api/identity");
    state.identity = data.identity || "";
    $("identity").value = state.identity;
  }

  // OpenDeck matches an application by the class opendeck-focus publishes, so offer those
  // names rather than letting a catalogue name like "orca" be typed into a mapping that can
  // never fire.
  async function loadIdentities() {
    const data = await fetchJSON(
      "/api/identities?identity=" + encodeURIComponent(state.identity || ""));
    const list = $("published");
    list.innerHTML = "";
    for (const name of data.identities || []) {
      const option = document.createElement("option");
      option.value = name;
      list.appendChild(option);
    }
    showWarning(data.warning);
  }

  function showWarning(text) {
    const box = $("identitywarning");
    box.textContent = text || "";
    box.classList.toggle("show", Boolean(text));
  }

  // An application nobody has written a catalogue for is not a dead end: a local model can
  // guess one. It is slow and it is a guess, so it is offered rather than done.
  function offerGuess() {
    const button = $("guess");
    const offer = Boolean(state.identity) && state.shortcuts.length === 0;
    button.classList.toggle("show", offer);
    button.disabled = false;
    if (offer) {
      button.textContent = `No shortcuts known for "${state.identity}" \u2014 ask the local model (slow)`;
    }
  }

  async function guessShortcuts() {
    const button = $("guess");
    button.disabled = true;
    button.textContent = "Asking the local model, this takes a while...";
    try {
      state.shortcuts = await fetchJSON(
        "/api/shortcuts?build=1&identity=" + encodeURIComponent(state.identity));
    } finally {
      renderList();
      offerGuess();
    }
  }

  // -- icon tray ------------------------------------------------------------
  // One action, several candidates the model drew. The deck reads only the chosen one, so
  // picking here is a copy, and drawing another can never overwrite one you liked.
  let trayFor = null;

  async function openTray(sc) {
    trayFor = sc.id;
    $("ip-title").textContent = `${sc.label} \u2014 ${sc.combo}`;
    $("iconpicker").classList.add("show");
    await renderTray(await fetchJSON(
      "/api/variants?identity=" + encodeURIComponent(state.identity) +
      "&id=" + encodeURIComponent(sc.id)));
  }

  async function renderTray(data) {
    const tray = $("tray");
    tray.innerHTML = "";
    if (data.current && !(data.variants || []).length) {
      // Art from before candidates existed: there is one image and nothing to choose between.
      tray.appendChild(trayFigure(data.current, "in use", true, null));
    }
    for (const v of data.variants || []) {
      tray.appendChild(trayFigure(v.data_uri, `#${v.n}${v.chosen ? " \u2713" : ""}`, v.chosen, v.n));
    }
    if (!tray.children.length) {
      const empty = document.createElement("p");
      empty.className = "hint";
      empty.textContent = "Nothing drawn for this action yet.";
      tray.appendChild(empty);
    }
  }

  function trayFigure(src, caption, chosen, n) {
    const fig = document.createElement("figure");
    if (chosen) fig.className = "is-chosen";
    const img = document.createElement("img");
    img.src = src;
    img.alt = caption;
    if (n !== null) img.addEventListener("click", () => chooseVariant(n));
    fig.appendChild(img);
    const cap = document.createElement("figcaption");
    cap.textContent = caption;
    fig.appendChild(cap);
    return fig;
  }

  async function chooseVariant(n) {
    const data = await fetchJSON("/api/choose", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identity: state.identity, id: trayFor, n }),
    });
    await renderTray(data);
    await loadShortcuts();
  }

  async function drawAnother() {
    const button = $("ip-draw");
    button.disabled = true;
    button.textContent = "Drawing...";
    try {
      const data = await fetchJSON("/api/variants", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ identity: state.identity, id: trayFor }),
      });
      if (data.ok === false) {
        $("tray").insertAdjacentHTML("beforeend", `<p class="hint">${esc(data.error)}</p>`);
      } else {
        await renderTray(data);
        await loadShortcuts();
      }
    } finally {
      button.disabled = false;
      button.textContent = "Draw another";
    }
  }

  async function loadDevices() {
    const devs = await fetchJSON("/api/devices");
    const sel = $("device");
    sel.innerHTML = "";
    for (const d of devs) {
      const opt = document.createElement("option");
      opt.value = d; opt.textContent = d;
      sel.appendChild(opt);
    }
    state.device = devs.length ? devs[0] : "";
  }

  async function loadShortcuts() {
    if (!state.identity) { state.shortcuts = []; renderList(); offerGuess(); return; }
    state.shortcuts = await fetchJSON(
      "/api/shortcuts?identity=" + encodeURIComponent(state.identity));
    rebuildCategoryFilter();
    renderList();
    offerGuess();
    await loadProfile();
  }

  async function loadProfile() {
    state.assignments = {};
    if (!state.identity || !state.device) { renderDeck(); return; }
    const url = "/api/profile?identity=" + encodeURIComponent(state.identity) +
      "&device=" + encodeURIComponent(state.device);
    const data = await fetchJSON(url);
    for (let p = FIRST_KEY; p <= LAST_KEY; p++) {
      const key = (data.keys || [])[p];
      if (!key || !key.settings) continue;
      const sc = state.shortcuts.find((s) => s.tokens === key.settings.down);
      if (sc) state.assignments[p] = sc.id;
    }
    renderDeck();
  }

  async function apply() {
    const result = $("result");
    result.textContent = "";
    const assignments = {};
    for (let p = FIRST_KEY; p <= LAST_KEY; p++) assignments[String(p)] = state.assignments[p] || null;
    const r = await fetch("/api/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ identity: state.identity, device: state.device, assignments }),
    });
    const data = await r.json();
    if (r.ok) {
      result.className = "ok";
      result.textContent = `Applied ${data.written} key(s) to profile "${data.profile}".`;
      showWarning(data.warning);
    } else {
      result.className = "err";
      result.textContent = data.error || "Apply failed.";
    }
  }

  // -- wiring ---------------------------------------------------------------
  $("textfilter").addEventListener("input", renderList);
  $("catfilter").addEventListener("change", renderList);
  $("identity").addEventListener("change", () => {
    state.identity = $("identity").value.trim();
    loadIdentities();
    loadShortcuts();
  });
  $("device").addEventListener("change", () => {
    state.device = $("device").value;
    loadProfile();
  });
  $("apply").addEventListener("click", apply);
  $("guess").addEventListener("click", guessShortcuts);
  $("ip-draw").addEventListener("click", drawAnother);
  $("ip-close").addEventListener("click", () => $("iconpicker").classList.remove("show"));
  $("iconpicker").addEventListener("click", (e) => {
    if (e.target.id === "iconpicker") $("iconpicker").classList.remove("show");
  });

  window.addEventListener("DOMContentLoaded", async () => {
    await loadIdentity();
    await loadIdentities();
    await loadDevices();
    if (state.identity) await loadShortcuts();
    renderDeck();
  });
</script>
</body>
</html>
